[project]
name = "satori-ai-gateway"
version = "0.1.0"
description = "KomeijiSatori — an AI gateway that reads the minds of upstream providers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # standard extra 提供 websockets——/satori/live 实时推送频道依赖它
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "loguru>=0.7",
    # Windows 的 zoneinfo 没有系统时区库，靠 tzdata 提供（ProviderPressure 用）
    "tzdata>=2024.1",
    # Ed25519 非对称凭据（v4 Phase 6G）：多团队跨网模式的验签/密钥对
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
satori = "satori_gateway.__main__:main"
satori-test-report = "satori_gateway.test_report_cli:main"
satori-test-mock = "satori_gateway.test_mock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["satori_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
