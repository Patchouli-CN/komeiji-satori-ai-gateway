# 觉之瞳 —— KomeijiSatori 配置

[gateway]
host = "127.0.0.1"
port = 8400
check_interval_seconds = 300
# 流式请求自动补 stream_options.include_usage，给 usage 分词侧信道喂数据
inject_usage = true

# 日志：level 支持 TRACE/DEBUG/INFO/WARNING/ERROR/CRITICAL；
# file 留空只输出控制台。完整堆栈用环境变量 LOGURU_FULL_TRACEBACK=1 开启
[logging]
level = "INFO"
file = "logs/satori.log"

# 上游列表。api_key 支持 "env:VAR_NAME" 从环境变量读取。
# models 列出该上游宣称提供的模型，网关按请求里的 model 路由。
# protocol 指定上游协议：默认 "openai"（OpenAI 兼容端点）；
# 设为 "anthropic" 可直连 Anthropic 官方 API 原生协议（pipelines/ 插件翻译）。
# 注意：logprobs 声纹指纹通道仅 openai 协议上游可用，anthropic 上游请开 answerprint。
[[upstreams]]
name = "openai"
base_url = "https://api.openai.com/v1"
api_key = "env:OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini"]

# [[upstreams]]
# name = "some-reseller"
# base_url = "https://example.com/v1"
# api_key = "env:RESELLER_KEY"
# models = ["claude-opus-4"]

# 直连 Anthropic 官方 API 的例子：
# [[upstreams]]
# name = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key = "env:ANTHROPIC_API_KEY"
# protocol = "anthropic"
# models = ["claude-opus-4"]

# 指纹核验：对固定 prompt 取首 token 的 top-logprobs 分布，
# 与可信参考指纹做 JS 散度比对。参考指纹用
#   python -m satori_gateway collect --upstream openai --model gpt-4o
# 从可信端点采集，存到 reference_dir。
[fingerprint]
reference_dir = "fingerprints"
# 每个上游+模型要核验时用的探针 prompt
probe_prompt = "The capital of France is"
top_logprobs = 10
# JS 散度超过该阈值判定为“不是同一个模型”
js_threshold = 0.15

# 自定义规则：见 rules.toml，命中累加可疑度，达到阈值实时告警
[rules]
path = "rules.toml"
suspicion_threshold = 50
# WATCH 等级阈值：可疑度到此进入“可能降级，提高关注”
watch_threshold = 25
# 账本衰减半衰期（秒）：孤立小错随时间归零，持续掺水照样积聚
decay_half_life_seconds = 3600
# 命中率通道：严重规则（≥25 分）命中率超 5% 告警，抗 90%真10%假 掺水
hit_rate_threshold = 0.05
hit_rate_min_samples = 50

# 身份探针：每轮从内置题组随机抽样主动问身份，厂商自报/截止年交叉验证
# + 首 token logprob 分布对参考指纹。注意：会产生真实 API 调用费用。
[identity]
enabled = true
sample_size = 5
max_tokens = 64

# 答案指纹：固定题组 temp=0 作答与官方参考算相似度，纯黑盒通道，
# Anthropic 系（无 logprobs）的主力指纹手段。参考用 satori answers 采集。
[answerprint]
enabled = true
similarity_threshold = 0.6
max_tokens = 128

# 流量录制：开启后每条请求的 请求文本/正文/CoT 按天追加到 JSONL，
# 可用 satori replay 离线回放取证（用今天的规则审昨天的流量）。
# 注意：录制的是对话文本本身，涉敏场景谨慎开启并管好 records 目录权限。
[record]
enabled = false
directory = "records"

# 熔断器：可疑度越界后拦截该 上游×模型 的后续请求（503），
# 低质量输出实时停工、不污染项目；人工确认后
# POST /satori/breaker/reset {"upstream":"...","model":"..."} 复位
# （需要 operator 角色凭据，见下方 [security]）
[breaker]
enabled = true

# 控制面封印授权（Gate 0 / Phase 6A+6B——v4 交付顺序的第一道门）：
#   签发/查询/吊销  → /satori/admin/*（X-Satori-Admin-Secret 把关）
#   feedback/breaker reset 等操作按角色授权：reporter / operator / admin
# HMAC 签名约定：三枚请求头 X-Satori-Reporter / X-Satori-Timestamp / X-Satori-Signature，
#   签名 = HMAC-SHA256(secret, "<timestamp>.<原始请求体>")，时间窗默认 5 分钟防重放。
# Ed25519 模式（Phase 6G）：method = "ed25519" 签发时附 public_key（PEM），
#   reporter 侧用私钥签 canonical_json{reporter_id, timestamp, nonce, body_hash}，
#   请求头加 X-Satori-Nonce（一次性）。多团队跨网场景推荐，配 require_tls。
# enabled = false 时控制面不鉴权（启动打醒目警告）——不安全必须显式选择。
[security]
enabled = true
mode = "hmac"
timestamp_window_seconds = 300
db = "state/credentials.db"
# 回环地址下留空：首次启动生成一次性引导 token（只打印一次），
# 用它 POST /satori/admin/credentials 签发第一个 operator 凭据；
# 非回环地址下必须配置，否则拒绝启动。
admin_secret = "env:SATORI_ADMIN_SECRET"
# TLS 前置（Phase 6F）：不配 = 按 host 联动（回环免 TLS、非回环强制）；
# true/false 显式指定。只影响 /satori/*，代理路径不受影响。
# require_tls = true
# 信任的反向代理 IP 段（CIDR）：只有这些来源的 X-Forwarded-Proto 才采信。
# trusted_proxies = ["10.0.0.0/8", "192.168.1.10"]

# 审计状态持久化（v4 Phase 1.0）：重启不失忆——审计状态是时间函数。
#   state/ledger.json            账本/熔断快照（防抖落盘 + 原子替换）
#   state/feedback.jsonl         误报反馈流水（replay 可关联翻旧账）
#   state/baseline_events.jsonl  基线事件流水（Phase 2 动态 TTL 的数据源）
# archive_dir 存放退役归档的参考基线（含 meta.json 留痕）。
[state]
directory = "state"
debounce_seconds = 1.0
archive_dir = "archive/baselines"

# 业务测试上报裁决（v4 Phase 5A——质量锚点）。POST /satori/test/report
# 需要 reporter 角色凭据；TRUSTED 的 PASS 才衰减嫌疑分、FAIL 才可熔断。
# score_floor 是负分地板：PASS 衰减不得把总分（质量+身份）压到这以下。
# 维度隔离：PASS 只洗质量类；身份类（声纹/答案指纹）洗不掉，
# 解冻只能重新采集基线或 operator 裁决（POST /satori/baseline/identity-cleared）。
[testing]
enabled = true
score_floor = 5.0

# 金丝雀：固定考题 + 期望子串，周期性抽查输出质量漂移
[[canary.cases]]
prompt = "用一句话回答：1+1 等于几？"
expect = "2"

[[canary.cases]]
prompt = "Reply with exactly the word: satori"
expect = "satori"
